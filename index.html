        <script>
        // D1 - panel "Dostepnosc 15-minutowa" (odpowiednik podpowiedzi HTML z QGIS)
        function panel15m(p) {
            var v = Number(p['index_15m']) || 0;
            var cls, col, bar;
            if (v <= 20) { cls = 'Krytycznie niska dostępność (Pustynia usługowa)'; col = '#c0392b'; bar = '#d7191c'; }
            else if (v <= 40) { cls = 'Niska dostępność'; col = '#e67e22'; bar = '#fdae61'; }
            else if (v <= 60) { cls = 'Średnia dostępność'; col = '#b7950b'; bar = '#f4d03f'; }
            else if (v <= 80) { cls = 'Dobra dostępność'; col = '#5d9c1f'; bar = '#a6d96a'; }
            else { cls = 'Wzorcowe Miasto 15-minutowe'; col = '#1a7f37'; bar = '#1a9641'; }
            var kat = [['cnt_edukacja','Edukacja'],['cnt_zdrowie','Zdrowie'],['cnt_handel','Handel'],
                       ['cnt_zielen','Zieleń i rekreacja'],['cnt_transport','Transport publiczny']];
            var rows = '', suma = 0, obecne = 0;
            for (var i = 0; i < kat.length; i++) {
                var n = Number(p[kat[i][0]]) || 0; suma += n;
                if (n > 0) { obecne++; }
                rows += '<tr class="' + (n > 0 ? 'on' : 'off') + '"><td>' + (n > 0 ? '&#10004; ' : '&#10006; ') + kat[i][1] +
                        '</td><td style="text-align:right">' + n + '</td></tr>';
            }
            rows += '<tr class="sum"><td>Suma POI (wszystkie kategorie)</td><td style="text-align:right">' + suma + '</td></tr>';
            return '<div class="p15"><div class="hd">Dostępność 15-minutowa</div><div class="bd">' +
                   '<div class="val" style="color:' + col + '">' + Math.round(v) + '%</div>' +
                   '<div class="bar"><div style="width:' + Math.max(0, Math.min(100, v)) + '%;background:' + bar + '"></div></div>' +
                   '<div class="cls">' + cls + '</div><table>' + rows + '</table>' +
                   '<div class="ft">Kategorie obecne: <b>' + obecne + ' z 5</b></div></div></div>';
        }
        </script>

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

                newLayersListHeight()
            });
